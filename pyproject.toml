[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jemeiwaa-climate-wind"
version = "1.0.0"
description = "Análisis reproducible del cambio climático y el potencial eólico de Jemeiwaa Ka'I"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
  {name = "Linda Catalina Correa Lozano"},
  {name = "Juan Camilo Bedoya Carmona"},
]
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "xarray==2025.10.1",
  "matplotlib==3.10.7",
  "scipy==1.15.3",
  "dask[array]==2025.11.0",
  "netCDF4==1.7.3",
  "cftime==1.6.4.post1",
]

[tool.setuptools]
py-modules = ["run_portfolio", "run_full_rebuild", "run_reproducible", "run_bankability"]

[tool.setuptools.packages.find]
include = ["reproducibilidad*", "bankability*"]
